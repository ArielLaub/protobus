services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: protobus-rabbitmq
    ports:
      # Movable, for a machine where 5672 is taken (a kubectl port-forward,
      # say); point PROTOBUS_TEST_AMQP_URL and PROTOBUS_TEST_MGMT_URL at them.
      - "${PROTOBUS_AMQP_PORT:-5672}:5672"
      - "${PROTOBUS_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
