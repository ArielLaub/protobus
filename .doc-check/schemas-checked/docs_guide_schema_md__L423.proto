syntax = "proto3";
package Orders;

import "common/money.proto";

// Enums
enum OrderStatus {
    ORDER_STATUS_UNKNOWN = 0;
    ORDER_STATUS_PENDING = 1;
    ORDER_STATUS_CONFIRMED = 2;
    ORDER_STATUS_SHIPPED = 3;
    ORDER_STATUS_DELIVERED = 4;
    ORDER_STATUS_CANCELLED = 5;
}

// Common messages
message Address {
    string street = 1;
    string city = 2;
    string state = 3;
    string postal_code = 4;
    string country = 5;
}

message OrderItem {
    string product_id = 1;
    string product_name = 2;
    int32 quantity = 3;
    common.Money unit_price = 4;
}

// Request/Response messages
message CreateOrderRequest {
    string user_id = 1;
    repeated OrderItem items = 2;
    Address shipping_address = 3;
    string coupon_code = 4;
    string idempotency_key = 10;
}

message CreateOrderResponse {
    string order_id = 1;
    OrderStatus status = 2;
    common.Money total = 3;
}

message GetOrderRequest {
    string order_id = 1;
}

message GetOrderResponse {
    string order_id = 1;
    string user_id = 2;
    repeated OrderItem items = 3;
    Address shipping_address = 4;
    OrderStatus status = 5;
    common.Money subtotal = 6;
    common.Money tax = 7;
    common.Money total = 8;
    int64 created_at = 9;
    int64 updated_at = 10;
}

message CancelOrderRequest {
    string order_id = 1;
    string reason = 2;
}

message CancelOrderResponse {
    bool success = 1;
    string message = 2;
}

// Event messages
message OrderCreatedEvent {
    string event_id = 1;
    int64 timestamp = 2;
    string order_id = 3;
    string user_id = 4;
    common.Money total = 5;
    int32 item_count = 6;
}

message OrderShippedEvent {
    string event_id = 1;
    int64 timestamp = 2;
    string order_id = 3;
    string tracking_number = 4;
    string carrier = 5;
}

message OrderCancelledEvent {
    string event_id = 1;
    int64 timestamp = 2;
    string order_id = 3;
    string reason = 4;
    string cancelled_by = 5;
}

// Service definition
service OrderService {
    rpc CreateOrder(Orders.CreateOrderRequest) returns(Orders.CreateOrderResponse);
    rpc GetOrder(Orders.GetOrderRequest) returns(Orders.GetOrderResponse);
    rpc CancelOrder(Orders.CancelOrderRequest) returns(Orders.CancelOrderResponse);
}
